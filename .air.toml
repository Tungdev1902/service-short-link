# .air.toml
root = "."
tmp_dir = "tmp"

[build]
  # Build ra binary và chạy, để Air kiểm soát stop/start tiến trình tránh lỗi port in use
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "logs", "migrations"]
  # Bật polling để tránh mất event file-change trên Windows bind mounts
  poll = true
  poll_interval = 500

[misc]
  # Cho Air thêm thời gian gửi tín hiệu dừng phiên bản cũ trước khi chạy bản mới
  clean_on_exit = true

[log]
  time = true

[screen]
  clear_on_rebuild = true

[kill]
  # Gửi SIGINT trước, đợi 1s rồi SIGKILL nếu cần
  cmd = ""
  signal = "int"
  delay = 1000

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"
