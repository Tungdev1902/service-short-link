# Debug docker-compose
#version: '3.8'

services:
  service_shortlink_debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
    container_name: app_debug
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8080:8080"
      - "2345:2345"  # Delve debugger port
    environment:
      - APP_PORT=8080
      - APP_ENV=development
      - DATABASE_HOST=mariadb
      - DATABASE_PORT=3306
      - DATABASE_USER=shortlink
      - DATABASE_PASSWORD=shortlink123
      - DATABASE_NAME=shortlink_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=XPY4b9BSp1FFqu6YhPItyT3qeWSQ9ylB
      - API_KEYS=dev-api-key-12345,test-api-key-67890
      - BASE_URL=http://localhost:8080
      - DOMAIN=localhost
      - DEFAULT_EXPIRY_SECONDS=${DEFAULT_EXPIRY_SECONDS:-300}
      - E2E_TEST_MODE=${E2E_TEST_MODE:-false}
      - TEST_DB_HOST=${TEST_DB_HOST:-mariadb_test}
      - TEST_DB_PORT=${TEST_DB_PORT:-3306}
      - TEST_DB_USER=${TEST_DB_USER:-testuser}
      - TEST_DB_PASSWORD=${TEST_DB_PASSWORD:-testpass}
      - TEST_DB_NAME=${TEST_DB_NAME:-shortlink_db_test}
    volumes:
      - .:/app:cached 
      - go-mod-cache:/go/pkg/mod 
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      mariadb_test:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shortlink-network

  mariadb:
    image: mariadb:10.11
    container_name: mariadb_debug
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=shortlink_db
      - MYSQL_USER=shortlink
      - MYSQL_PASSWORD=shortlink123
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shortlink-network

  redis:
    image: redis:7-alpine
    container_name: redis_debug
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortlink-network

  redis_ui:
    image: patrikx3/p3x-redis-ui:latest
    container_name: redis_ui
    restart: unless-stopped
    ports:
      - "7843:7843"
    volumes:
      - ./docker/redis-ui-settings:/settings
    depends_on:
      redis:
        condition: service_started
    networks:
      - shortlink-network

  mariadb_test:
    image: mariadb:10.11
    container_name: mariadb_test_debug
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=testrootpass
      - MYSQL_DATABASE=shortlink_db_test
      - MYSQL_USER=testuser
      - MYSQL_PASSWORD=testpass
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "3316:3306"
    volumes:
      - mariadb-test-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptestrootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shortlink-network

networks:
  shortlink-network:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
  redis-data:
    driver: local
  redis-ui-settings:
    driver: local
  go-mod-cache:
    driver: local
  mariadb-test-data:
    driver: local
